<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cats by Post</title>
<style>
  html, body { margin: 0; height: 100%; background: #e9e4d8; overflow: hidden; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; }
  #screen { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh;
            image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  #atlas { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
           background: rgba(29, 26, 34, 0.55); }
  #atlas.on { display: flex; }
  #atlasBox { background: #e9e4d8; border: 4px solid #1d1a22; padding: 16px; display: flex; max-width: calc(100vw - 48px);
              flex-direction: column; align-items: center; gap: 12px; box-shadow: 8px 8px 0 #2e2a33; box-sizing: border-box; }
  #atlasScroll { max-width: 100%; max-height: calc(100vh - 170px); overflow: auto; }
  #atlasCanvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  #atlasBox .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  #atlasBox button { font: 600 14px/1 ui-monospace, Menlo, monospace; color: #fff7e3; background: #a8322f;
                     border: 3px solid #1d1a22; padding: 8px 14px; cursor: pointer; }
  #atlasBox button:hover { background: #d6493c; }
  #atlasHint { font: 12px/1.2 ui-monospace, Menlo, monospace; color: #4a2f24; }
  #hud { position: fixed; left: 8px; right: 8px; bottom: 10px; margin: 0 auto; width: max-content; display: none; flex-direction: column;
         gap: 6px; padding: 8px 10px; max-width: calc(100vw - 22px); box-sizing: border-box; background: #e9e4d8; border: 3px solid #1d1a22;
         box-shadow: 4px 4px 0 #2e2a33; font: 13px/1.3 ui-monospace, Menlo, monospace; color: #1d1a22; }
  #hud.on { display: flex; }
  #hud .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  #lvlPick { font: 700 13px/1.2 ui-monospace, Menlo, monospace; color: #1d1a22; background: #fff7e3; border: 2px solid #1d1a22;
             padding: 4px 6px; margin-right: 6px; max-width: min(38ch, calc(100vw - 60px)); cursor: pointer; }
  #stars { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 12px; font-weight: 700; }
  #stars .star { color: #8f8a80; } #stars .star.on { color: #a8322f; }
  #dailyInfo { margin: 0; color: #4a2f24; }
  #hud button { font: 600 13px/1 ui-monospace, Menlo, monospace; color: #1d1a22; background: #e2b77f;
                border: 2px solid #1d1a22; padding: 6px 9px; cursor: pointer; }
  #hud button:hover:not(:disabled) { background: #f5dc8a; }
  #hud button:disabled { opacity: 0.45; cursor: default; }
  #hud button[aria-pressed="true"] { outline: 3px solid #1d1a22; outline-offset: 1px; background: #fff7e3; }
  #hud .sw { display: inline-block; width: 10px; height: 10px; margin-right: 5px; border: 2px solid #1d1a22; vertical-align: -2px; }
  #hud .sw.plain { background: #c38f5a; } #hud .sw.ginger { background: #d97a36; } #hud .sw.blue { background: #56638f; }
  #btnSend { background: #d6493c !important; color: #fff7e3 !important; }
  #btnSend:hover { background: #f07a5e !important; }
  #status { margin: 0; min-height: 1.3em; max-width: 70ch; }
  #editor { position: fixed; top: 8px; right: 8px; display: none; flex-direction: column; gap: 6px; width: 300px;
            max-width: calc(100vw - 22px); max-height: calc(100vh - 16px); overflow: auto; box-sizing: border-box; padding: 8px 10px;
            background: #e9e4d8; border: 3px solid #1d1a22; box-shadow: 4px 4px 0 #2e2a33; font: 12px/1.35 ui-monospace, Menlo, monospace; color: #1d1a22; }
  #editor.on { display: flex; }
  #editor .row { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
  #editor b.h { font-size: 13px; }
  #editor button { font: 600 12px/1 ui-monospace, Menlo, monospace; color: #1d1a22; background: #e2b77f; border: 2px solid #1d1a22; padding: 5px 7px; cursor: pointer; }
  #editor button:hover { background: #f5dc8a; }
  #editor button[aria-pressed="true"] { background: #fff7e3; outline: 2px solid #1d1a22; }
  #editor input, #editor select, #editor textarea { font: 12px ui-monospace, Menlo, monospace; border: 2px solid #1d1a22; background: #fff7e3; color: #1d1a22; padding: 3px 4px; }
  #editor input[type=number] { width: 3.2em; }
  #editor textarea { width: 100%; box-sizing: border-box; }
  #edStatus { margin: 0; min-height: 2.6em; }
  #edBack { display: none; }
  #perf { position: fixed; top: calc(6px + env(safe-area-inset-top)); right: calc(6px + env(safe-area-inset-right)); margin: 0;
          padding: 4px 6px; white-space: pre; pointer-events: none; font: 11px/1.35 ui-monospace, Menlo, monospace;
          color: #fff7e3; background: rgba(29, 26, 34, 0.75); }
  #editor [hidden], #hud [hidden] { display: none !important; }
  @media (max-height: 520px) and (orientation: landscape) {        /* phone on its side: HUD top-left, clear of the board */
    #hud { left: 8px; right: auto; top: 8px; bottom: auto; margin: 0; max-width: 36vw; font-size: 12px; }
    #hud button { padding: 5px 7px; font-size: 12px; }
  }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="hud" aria-label="Cats by Post">
  <div class="row"><select id="lvlPick" aria-label="Level: pick one to play"></select>
    <span id="tray" class="row" role="group" aria-label="Turntable tray">
      <button type="button" data-type="plain" aria-pressed="true"><i class="sw plain"></i>Plain <b></b></button>
      <button type="button" data-type="ginger" aria-pressed="false"><i class="sw ginger"></i>Ginger <b></b></button>
      <button type="button" data-type="blue" aria-pressed="false"><i class="sw blue"></i>Blue <b></b></button>
    </span>
  </div>
  <div class="row">
    <button type="button" id="btnSend">Send the post</button>
    <button type="button" id="btnClear">Clear turntables</button>
    <button type="button" id="btnHint">Hint</button>
    <button type="button" id="btnNext" disabled>Next level</button>
    <button type="button" id="btnShare" hidden>Share</button>
    <button type="button" id="edBack">Back to editor</button>
  </div>
  <p id="status" role="status" aria-live="polite"></p>
  <p id="stars" hidden></p>
  <p id="dailyInfo" hidden></p>
</div>
<div id="editor" aria-label="Level editor">
  <div class="row"><b class="h">Level editor</b>
    <select id="edLoad" aria-label="Start from"></select></div>
  <div class="row"><label>id <input id="edId" size="5"></label> <label>title <input id="edTitle" size="14"></label></div>
  <div class="row">Board
    <button type="button" data-ed="w-" aria-label="Narrower">&minus;</button><span id="edW"></span><button type="button" data-ed="w+" aria-label="Wider">+</button>
    &times;
    <button type="button" data-ed="h-" aria-label="Shorter">&minus;</button><span id="edH"></span><button type="button" data-ed="h+" aria-label="Taller">+</button>
    <label>time limit <input id="edTime" type="number" min="6" max="120" aria-describedby="edTimeHint"></label> <span id="edTimeHint">ticks</span></div>
  <div class="row" role="group" aria-label="Tool">
    <button type="button" data-tool="hatch">Hatch</button><button type="button" data-tool="basket-ginger">Ginger basket</button>
    <button type="button" data-tool="basket-blue">Blue basket</button><button type="button" data-tool="dog">Dog</button>
    <button type="button" data-tool="erase">Erase</button></div>
  <div class="row"><label>Cats <input id="edCats" size="9" placeholder="gb" aria-describedby="edCatsHint"></label> <span id="edCatsHint"></span></div>
  <div class="row">Turntables <label>plain <input id="edTP" type="number" min="0" max="6"></label>
    <label>ginger <input id="edTG" type="number" min="0" max="6"></label> <label>blue <input id="edTB" type="number" min="0" max="6"></label></div>
  <div class="row"><button type="button" id="edCheck">Check</button><button type="button" id="edTry">Try it</button><button type="button" id="edExport">Export JSON</button></div>
  <p id="edStatus" role="status" aria-live="polite"></p>
  <textarea id="edOut" rows="8" readonly hidden aria-label="Level JSON"></textarea>
  <div class="row" id="edOutRow" hidden><button type="button" id="edCopy">Copy</button><button type="button" id="edDl">Download .json</button></div>
</div>
<div id="atlas"><div id="atlasBox">
  <div id="atlasScroll"><canvas id="atlasCanvas"></canvas></div>
  <div class="row"><button type="button" data-file="atlas.png">atlas.png</button><button type="button" data-file="atlas-index.png">atlas-index.png</button>
    <button type="button" data-file="atlas.json">atlas.json</button><button type="button" data-file="palette.json">palette.json</button></div>
  <div id="atlasHint">S to close</div>
</div></div>

// ============================================================================
// 10 RULES: the Cats by Post puzzle as a pure, deterministic simulation. No DOM,
// canvas, clock or randomness, and whole numbers only: the caller advances it
// one tick at a time, once every 300 ms. This is the part to port 1:1 to Swift,
// which runs the same golden cases (tests/golden.json).
//
// Board: x = column (+x right), y = row (+y down); (0,0) is the back corner tile,
// and the board's edges are walls. Level and result data use names that map to
// Swift enums: Dir U R D L; Coat ginger blue; TurntableType plain ginger blue;
// Outcome running won wrongBasket timeUp; CatState waiting travelling delivered
// puzzled. Inside, directions are 0 R, 1 D, 2 L, 3 U (clockwise, like the scene's
// E S W N) and coats 1 ginger, 2 blue (a coloured turntable has its coat's number).
//
// The rules (exact: the levels depend on them):
//  1. One tick every 300 ms (the caller's clock).
//  2. Each tick: first move every travelling cat, then release new cats.
//  3. Each hatch releases its cats in order, one every 2 ticks from tick 0. A new
//     cat appears on the hatch tile facing the hatch's direction and starts
//     moving on the next tick.
//  4. A cat steps 1 tile. Into a wall or a dog it reverses and steps that way in
//     the same tick; if that's blocked too, it stays where it is.
//  5. Entering a tile: its own coat's basket delivers it; the other basket leaves
//     it puzzled there (the attempt has failed); a turntable turns it to face the
//     turntable's way (plain turns every cat, ginger only ginger, blue only blue).
//  6. Hatch tiles are plain floor once a cat has left them.
//  7. Cats pass through each other. A puzzled cat doesn't block its basket.
//  8. Won: every cat delivered. After a wrong basket the run plays on until every
//     cat is delivered or puzzled, or time runs out, and ends wrongBasket. Time up:
//     the level's time limit (36 ticks unless it sets timeLimit) with cats still out.
//
// Level data (format 1) can grow: each kind of piece is its own optional list
// (missing = none), and a hatch's cat is a coat name or an object with a coat.
// ============================================================================
const GR_DIR = { R: 0, D: 1, L: 2, U: 3 }, GR_DIRS = ['R', 'D', 'L', 'U'];
const GR_DX = [1, 0, -1, 0], GR_DY = [0, 1, 0, -1];
const GR_TICK_MS = 300, GR_TIME_LIMIT = 36, GR_RELEASE_EVERY = 2;
const GR_GINGER = 1, GR_BLUE = 2, GR_COAT = { ginger: 1, blue: 2 }, GR_COATS = [null, 'ginger', 'blue'];
const GR_PLAIN = 0, GR_TYPE = { plain: 0, ginger: 1, blue: 2 }, GR_TYPES = ['plain', 'ginger', 'blue'];
const GC_FLOOR = 0, GC_DOG = 1, GC_BASKET_GINGER = 2, GC_BASKET_BLUE = 3, GC_HATCH = 4;
const GO_RUNNING = 'running', GO_WON = 'won', GO_WRONG = 'wrongBasket', GO_TIME_UP = 'timeUp';
const GL_WAIT = 0, GL_BOARD = 1, GL_DONE = 2, GL_WRONG = 3, GL_STATES = ['waiting', 'travelling', 'delivered', 'puzzled'];
const GE_NONE = 0, GE_RELEASED = 1, GE_MOVED = 2, GE_DELIVERED = 3, GE_WRONG = 4, GE_STUCK = 5;

const grList = (a) => a || [];                          // a piece list a level leaves out is empty
function grCatCoat(c) { return GR_COAT[c !== null && typeof c === 'object' ? c.coat : c] || 0; }

// A fresh simulation of a level with the player's turntables ([{x, y, type, dir}]).
function grCreate(level, placements) {
  const W = level.board.w, H = level.board.h;

const GLASS_X = -GLASS_D;

function rrSdf(x, y, x0, y0, x1, y1, r) {
  const cx = (x0 + x1) * 0.5, cy = (y0 + y1) * 0.5;
  const qx = Math.abs(x - cx) - ((x1 - x0) * 0.5 - r), qy = Math.abs(y - cy) - ((y1 - y0) * 0.5 - r);
  const ox = qx > 0 ? qx : 0, oy = qy > 0 ? qy : 0;

// ---- 1. backdrop + table shadow ----------------------------------------------------
function bakeBackdrop() {
  sIdx.fill(C.BG0); sLvl.fill(2); sDep.fill(DEPTH_EMPTY); sFlg.fill(FL_BACK);
  const Z = -BASE_H;
  for (let py = 0; py < WH; py++) for (let px = 0; px < WW; px++) {
    const b = py - OY + Z, a = (px - OX + 0.5) * 0.5;
    const x = b + a, y = b - a;
    const d = rrSdf(x - 5, y - 5, BASE_X0, BASE_Y0, BASE_X1, BASE_Y1, BASE_R + 4);
    const v = clamp(1 - d / 16, 0, 1);
    const k = Math.floor(v * 2 + bayer(px, py) * 0.999);
    if (k > 0) sIdx[py * WW + px] = k === 1 ? C.BG1 : C.BG2;
  }

// ---- 2. diorama base: rounded slab with wood grain ----------------------------------
function bakeBase() {
  shFlat = false; shSunMax = 0; shFlag = 0; shBias = 0;
  const inside = (t, a) => rrSdf((t + a) * 0.5, (t - a) * 0.5, BASE_X0, BASE_Y0, BASE_X1, BASE_Y1, BASE_R) <= 0;
  for (let px = 0; px < WW; px++) {
    const a = px - OX + 0.5;
    let t = Math.max(340, BASE_X1 + BASE_Y1 + 8), found = false;      // from beyond the base's front corner (340 for the office)
    for (; t > -340; t -= 0.25) if (inside(t, a)) { found = true; break; }
    if (!found) continue;
    const xb = (t + a) * 0.5, yb = (t - a) * 0.5;
    const e = 0.5;
    const nx = rrSdf(xb + e, yb, BASE_X0, BASE_Y0, BASE_X1, BASE_Y1, BASE_R) - rrSdf(xb - e, yb, BASE_X0, BASE_Y0, BASE_X1, BASE_Y1, BASE_R);
    const ny = rrSdf(xb, yb + e, BASE_X0, BASE_Y0, BASE_X1, BASE_Y1, BASE_R) - rrSdf(xb, yb - e, BASE_X0, BASE_Y0, BASE_X1, BASE_Y1, BASE_R);
    if (nx + ny <= 0) continue;                      // back-facing
    const f = clamp(Math.atan2(ny, nx) / (Math.PI / 2), 0, 1);  // 0 = faces +x, 1 = faces +y
    const zc = t * 0.5 + OY;
    for (let py = Math.floor(zc); py <= Math.ceil(zc + BASE_H) + 1; py++) {
      const z = zc - py;
      if (z > 0 || z < -BASE_H || py < 0 || py >= WH) continue;
      let c = C.WD2;
      shLvl = Math.floor(f * 2.2 + bayer(px, py) * 0.999) - 1;   // warm on the window side
      if (BOXR && shLvl > 0) shLvl = 0;                          // a Box Room's light sets would turn that sunlit
      const g = fract(z * 0.23 + 0.55 * Math.sin(a * 0.045 + z * 0.37) + hash2(px >> 3, 3) * 0.1);
      if (g < 0.16) c = C.WD1;
      else if (g > 0.9) c = C.WD3;
      if (hash2(px >> 1, Math.floor(z)) < 0.015) c = C.WD1;       // pores
      if (z > -1.5) { c = C.WD4; }
      else if (z > -2.5) { c = C.WD3; }
      else if (z >= -6 && z < -5) { c = C.WD1; }                  // routed groove
      if (z < -BASE_H + 1) { c = C.WD0; shLvl = -1; }
      emit(px, py, xb, yb, z, F_Y, c);
    }
  }
  // top rim (z = 0) outside the room floor
  for (let py = 0; py < WH; py++) for (let px = 0; px < WW; px++) {
    const b = py - OY, a = (px - OX + 0.5) * 0.5, x = b + a, y = b - a;
    if (x >= 0 && y >= 0 && x < ROOM_X && y < ROOM_Y) continue;
    const d = rrSdf(x, y, BASE_X0, BASE_Y0, BASE_X1, BASE_Y1, BASE_R);
    if (d > 0) continue;
    shLvl = 0;
    let c = C.WD3;
    if (d > -1.2) c = C.WD4;
    else if ((x >= ROOM_X && x < ROOM_X + 1) || (y >= ROOM_Y && y < ROOM_Y + 1)) c = C.WD1;
    else if (hash2(Math.floor(x * 0.5), Math.floor(y * 0.5)) < 0.06) c = C.WD2;
    emit(px, py, x, y, 0, F_TOP, c);
  }
}

// ---- 3. floorboards and stone sorting floor -----------------------------------------
function shFloor(face, u, v) {

  return plankTex(u, v);
}
function plankTex(u, v) {                             // floorboards (the Box Room shares them): seams, nails, sheen, grain
  const PW = 6;

  const ux = u + hash2(row, 7) * 60, seg = Math.floor(ux / len), ul = ux - seg * len;
  if (vy < 1) return C.WD1;

  const tone = hash2(row * 17 + seg, 5);
  if (vy >= 1 && vy < 2 && tone > 0.45) return C.WD3;                 // sheen on some boards
  const h = hash2(Math.floor(ux * 0.34), row * 13 + Math.floor(vy));
  if (h < 0.035) return tone > 0.5 ? C.WD3 : C.WD1;                   // sparse knots / pores
  const g = fract(ux * 0.045 + vy * 0.23 + tone * 7);                 // long soft grain streaks

}
function shStone(face, u, v) {
  const tu = u % 16, tv = v % 16, ti = Math.floor(u / 16), tj = Math.floor(v / 16);
  if (tu < 1 || tv < 1) return C.FT0;
  if (tu < 2 || tv < 2) return C.FT2;
  const t = hash2(ti * 7 + 3, tj * 5 + 1);
  return speck(u + t * 50, v, 9, C.FT1, C.FT0, C.FT2, 0.045);
}
function shKerbTop(face, u, v) { return face === F_TOP ? C.BR2 : face === F_Y ? C.WD3 : C.WD2; }
function bakeFloor() {
  shFlat = false; shSunMax = 2; shBias = 0;
  shFlag = FL_FLOOR | FL_ROOM;
  faceTop(0, 0, ROOM_X, ROOM_Y, 0, shFloor, C.WD0, 0);
  shSunMax = 1;                                       // pale stone: keep the letters the brightest thing
  faceTop(GX0, GY0, GX1, GY1, 0, shStone, C.FT0, 0);
  shSunMax = 2;
  shFlag = FL_ROOM;
  // brass-capped kerb on the open sides of the sorting floor
  box(GX0 - 2, GY0, 0, GX0, GY1 + 2, 2, shKerbTop, C.WD0, 3);      // low, so it never hides a tile
  box(GX0 - 2, GY1, 0, GX1 + 2, GY1 + 2, 2, shKerbTop, C.WD0, 3);
  box(GX1, GY0, 0, GX1 + 2, GY1 + 2, 2, shKerbTop, C.WD0, 3);

// ---- 4. walls -------------------------------------------------------------------
function wallTex(u, z, seed) {
  if (z < SKIRT_Z) return z >= SKIRT_Z - 1 ? C.WD4 : z < 1 ? C.WD1 : C.WD3;
  if (z < DADO_Z) {                                   // tongue-and-groove wainscot
    const bu = (u + seed) % 7;
    if (bu < 1) return C.WD2;
    if (bu < 2) return C.WD4;
    return hash2(Math.floor((u + seed) / 7), Math.floor(z / 3)) < 0.12 ? C.WD2 : C.WD3;
  }
  if (z < DADO_Z + 3) return z >= DADO_Z + 2 ? C.WD4 : z < DADO_Z + 1 ? C.WD2 : C.WD3;
  if (z >= ROOM_H - 2) return C.BG0;                  // cornice
  if (z >= ROOM_H - 4) return C.PL1;
  const h = hash2(Math.floor(u) + seed * 97, Math.floor(z));
  return h < 0.006 ? C.PL1 : h > 0.992 ? C.BG0 : C.PL2;

function winAt(y, z) {                                // opening index at wall-plane (y,z) or -1
  for (let k = 0; k < WINS.length; k++) {
    const w = WINS[k];
    if (y >= w.y0 && y < w.y1 && z >= w.z0 && z < w.z1) return k;
  }
  return -1;
}
function shWallL(face, u, z) {                        // left wall, plane x = 0, u = y

  for (let k = 0; k < WINS.length; k++) {

    if (u >= w.y0 - 3 && u < w.y1 + 3 && z >= w.z0 - 1 && z < w.z1 + 3) {

      return (u < w.y0 - 2 || z >= w.z1 + 2) ? C.WD2 : C.WD3;

  return wallTex(u, z, 3);
}
function shWallR(face, u, z) {                        // right wall, plane y = 0, u = x

function shRevealSide(face, u, v) { shFlag = FL_ROOM; return face === F_TOP ? C.WD3 : C.PL1; }

function shGlass(face, lu, lv) {                      // glass plane of window curWin (local coords)

  shFlag = FL_ROOM;

function shCap(face, u, v) { shFlag = 0; return face === F_TOP ? C.BG0 : face === F_Y ? C.PL2 : C.PL1; }
function bakeWalls() {

// ============================================================================
// 23 SCENE B: game board data, pigeonhole bank, clock, noticeboard, parcel
// shelf, crate, chutes, baked ambient occlusion
// ============================================================================
// ---- the sorting board (grid cells c = 0..5, r = 0..3) ------------------------------
const DXS = [1, 0, -1, 0], DYS = [0, 1, 0, -1];      // 0 E(+x) 1 S(+y) 2 W(-x) 3 N(-y)
const RED = 1, BLUE = 2;                               // address colours (red = ginger cats)
function cellX(c) { return GX0 + c * TILE; }
function cellY(r) { return GY0 + r * TILE; }

// ---- footprints for contact shadows ------------------------------------------------
const FOOT = [];
function addFoot(x0, y0, x1, y1, s) { if (!occLocked) FOOT.push([x0, y0, x1, y1, s]); }
function solid(x0, y0, z0, x1, y1, z1, fs) { addOcc(x0, y0, z0, x1, y1, z1); if (fs) addFoot(x0, y0, x1, y1, fs); }

// ---- pigeonhole bank on the right wall ---------------------------------------------
const BANK_X0 = SCN.bank.x0, BANK_X1 = SCN.bank.x1, BANK_SPLIT = SCN.bank.split, BANK_Z0 = SCN.bank.z0, BANK_Z1 = SCN.bank.z1, BANK_D = SCN.bank.d;

let bankCx = 0;
function bankRed(x) { return x < BANK_SPLIT; }
function shBankBack(face, u, v) {
  const x = u + BANK_X0;
  return bankRed(x) ? (hash2(x >> 1, v | 0) < 0.1 ? C.RD1 : C.RD0) : (hash2(x >> 1, v | 0) < 0.1 ? C.BL1 : C.BL0);
}
function shBankDiv(face, u, v) {
  const red = bankRed(bankCx);
  if (face === F_Y) return red ? C.RD2 : C.BL2;             // painted front edge
  if (face === F_TOP) return red ? C.RD3 : C.BL3;
  return red ? C.RD1 : C.BL1;                                // inner side
}
function shBankShelf(face, u, v) {
  const red = bankRed(u + BANK_X0);
  if (face === F_TOP) return red ? C.RD1 : C.BL1;
  return red ? C.RD2 : C.BL2;
}

  if (face === F_Y) return fract(v * 0.37 + u * 0.021) < 0.12 ? C.WD2 : C.WD3;
  return fract(v * 0.37 + u * 0.021) < 0.12 ? C.WD1 : C.WD2;

function shEnvelope(face, u, v) {

  if (face === F_X) return t < 0.2 ? C.KRAFT0 : C.PAPSH;

function bakeBank() {
  shFlag = FL_ROOM; shSunMax = SUN_OBJ; shBias = 0;

  faceY(BANK_X0, BANK_X1, BANK_Z0, BANK_Z1, 2, shBankBack, C.OUT, 0);
  solid(BANK_X0, 0, BANK_Z0, BANK_X1, 2, BANK_Z1, 0);
  // a cushion in every cubby: these are cat beds (the cats are drawn per frame, 26_cats)
  for (let cx = 0; cx < 14; cx++) for (let rz = 0; rz < 5; rz++) {
    const x = BANK_X0 + cx * CUB_W, z = BANK_Z0 + rz * CUB_H + 0.5;
    cushRed = bankRed(x + 1);

  }

  for (let j = 1; j < 5; j++) {
    const z = BANK_Z0 + j * CUB_H;
    box(BANK_X0, 2, z - 0.5, BANK_X1, BANK_D, z + 0.5, shBankShelf, C.OUT, 0);
    addOcc(BANK_X0, 2, z - 0.5, BANK_X1, BANK_D, z + 0.5);

    box(x - 0.5, 2, BANK_Z0, x + 0.5, BANK_D, BANK_Z1, shBankDiv, C.OUT, 0);
    addOcc(x - 0.5, 2, BANK_Z0, x + 0.5, BANK_D, BANK_Z1);

  box(BANK_X1, 0, 0, BANK_X1 + 2, BANK_D + 1, BANK_Z1 + 1, shWood, C.WD0, 3);

let cushRed = true;

// ---- clock (face; hands are dynamic) -------------------------------------------------

// ---- noticeboard: pinned photos of cats, paw-print cut-outs, a kraft note (no text) --------

function shNotice(face, u, v) {

          if (sx < 0 || sy < 0 || sx >= AC || sy >= AC || cell.idx[i] === 255) continue;
          const c = tab[cell.lvl[i] * PAL_N + cell.idx[i]];
          for (let j = 0; j < k; j++) for (let q = 0; q < k; q++) px[(y * k + j) * CW * k + x * k + q] = c;
        }
        const tmp = document.createElement('canvas'); tmp.width = CW * k; tmp.height = CH * k; tmp.getContext('2d').putImageData(img, 0, 0);
        g.drawImage(tmp, LBL + ci * CW * k, (12 + ri * CH) * k);
      });
    });
    return out.toDataURL('image/png');
  };
  // Bake each room and check every tile core shows its own stone floor; the review room comes back after.
  __so.boxCoverage = (list) => {
    const out = { rooms: 0, tiles: 0, bad: [], ms: 0 };
    const t0 = performance.now();
    for (const a of list) {
      const r = boxRoomFor(a);
      useBoxRoom(r); bakeBoxRoom();
      out.rooms++; out.tiles += r.board.w * r.board.h;
      for (const t of bxCheckCores()) if (out.bad.length < 40) out.bad.push(a.join(',') + ' tile ' + t[0] + ',' + t[1] + ' ' + t[2]);
    }
    out.ms = Math.round(performance.now() - t0);
    if (BOX_REVIEW) showBoxRoom(boxRoomFor(BOX_REVIEW.args));
    return out;
  };
}
// Start once every module above has been defined.
boot();
</script>

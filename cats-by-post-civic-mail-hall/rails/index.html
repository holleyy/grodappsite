<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sorting Office · stair geometry</title><style>body{margin:0;background:#f6f1e2;color:#294f50;font:18px/1.5 system-ui}main{max-width:1100px;margin:auto;padding:24px}h1{font:36px Georgia,serif}a{color:#216b70}figure{margin:28px 0}img{width:100%;height:auto;border-radius:8px}figcaption{padding:10px 0}nav{display:flex;gap:24px;flex-wrap:wrap}</style><main><h1>Connected steps and handrails</h1><p>The uprights now sit on the treads and meet the handrail. The slope levels off at the final tread, joining the landing rail. A continuous stair body removes the false edges and floating-looking posts.</p><nav><a href="https://holleyy.github.io/grodappsite/cats-by-post-civic-mail-hall/?v=rails&amp;view=hall">Explore the study →</a><a href="https://holleyy.github.io/grodappsite/cats-by-post-sorting-office-review/?v=rails">Play with the regular UI →</a></nav><figure><img src="after.jpg" alt="Corrected steps with planted upright posts touching continuous handrails and a solid flat-bottomed stair body"><figcaption>Corrected: connected rails and a continuous flight.</figcaption></figure><figure><img src="before.jpg" alt="Previous steps with post overshoots and internal stair faces visible across the flight"><figcaption>Before: the handrail slope missed the post tops, and internal faces painted across the lower steps.</figcaption></figure></main></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f0e5cf"><title>The Lantern Loft · Cats by Post</title><link rel="stylesheet" href="study.css"></head>
<body>
<header><a class="identity" href="study.html"><span class="stamp" aria-hidden="true">✉</span><span><small>CATS BY POST</small><strong>The Lantern Loft</strong></span></a><p>A little room for a great deal of post.</p><a class="regular" href="regular.html" target="_blank" rel="noopener">Open regular interface <span aria-hidden="true">↗</span></a></header>
<nav aria-label="Loft modes"><div class="modes"><button data-mode="daily" aria-pressed="true">Today’s post</button><button data-mode="practice" aria-pressed="false">Practice</button><button data-mode="night" aria-pressed="false">Night Shift</button><button data-mode="room" aria-pressed="false">Explore the room</button></div><div class="view"><button id="camera">Whole room</button><button id="motion" aria-pressed="false">Pause ambience</button><button id="greyscale" aria-pressed="false">Greyscale</button><button id="controls" aria-expanded="false" aria-controls="settings">Details <span aria-hidden="true">⌄</span></button></div></nav>
<form id="settings" hidden><label>Date <input id="date" type="date" required></label><label>Practice day <select id="weekday"><option value="0">Monday</option><option value="1">Tuesday</option><option value="2">Wednesday</option><option value="3">Thursday</option><option value="4">Friday</option><option value="5">Saturday</option><option value="6">Sunday</option></select></label><label>Seed <input id="seed" type="number" min="0" max="4294967295" step="1" value="303"></label><label class="room-only" hidden>Season preview <select id="season"><option value="">From date</option><option value="winter">Winter</option><option value="spring">Spring</option><option value="summer">Summer</option><option value="autumn">Autumn</option></select></label><label class="room-only" hidden>Board <select id="size"></select></label><label class="room-only" hidden>Light <select id="light"><option value="daily">Daytime</option><option value="free">Night</option></select></label><button type="submit">Open this room <span aria-hidden="true">→</span></button><span class="help">The date sets the weekday light and seasonal details.</span></form>
<main><iframe id="loft" title="Playable Lantern Loft" allow="autoplay"></iframe><div id="loading" role="status"><span class="seal" aria-hidden="true">✉</span><p>Opening the loft…</p></div><p id="error" role="alert" hidden></p></main>
<footer><span id="caption" aria-live="polite">Today’s post</span><span>Review edition · your usual saves are separate</span><a href="review/index.html" target="_blank" rel="noopener">Before &amp; after</a><a href="boxroom-build.json" target="_blank" rel="noopener">Build record</a></footer>
<script src="study.js"></script></body></html>

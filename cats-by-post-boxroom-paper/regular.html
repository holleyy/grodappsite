<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Cats by Post · Lantern Loft review</title><style>html,body,iframe{width:100%;height:100%;margin:0;border:0;display:block;background:#eee3cb}#status{position:fixed;inset:0;display:grid;place-content:center;text-align:center;background:#eee3cb;color:#315a55;font:20px Georgia,serif}#status[hidden]{display:none}a{color:inherit}</style></head><body><iframe id="game" src="journey/play/index.html" title="Cats by Post regular interface" allow="autoplay"></iframe><div id="status">Opening the loft…</div><script>
(async()=>{const frame=document.getElementById('game'),status=document.getElementById('status');try{let app;for(let i=0;i<1200;i++){app=frame.contentWindow.APP;if(app)break;await new Promise(r=>setTimeout(r,50));}if(!app)throw Error('The loft could not be opened.');const q=new URLSearchParams(location.search),mode=q.get('mode')==='night'?'night':q.get('mode')==='practice'?'practice':'daily';let ok;if(app.saved&&!q.has('mode'))ok=await app.continueGame();else ok=await app.start(mode,mode==='daily'?q.get('date')||undefined:mode==='night'?Number(q.get('seed')||303):{weekday:Number(q.get('day')||0),seed:Number(q.get('seed')||303)});if(!ok)throw Error('The post could not be opened.');app.engine.camera('room');status.hidden=true;}catch(e){status.textContent=e.message+' Please reload to try again.';}})();
</script></body></html>

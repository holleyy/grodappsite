<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5efde">
  <title>The postal valley · Cats by Post</title>
  <link rel="icon" href="journey/icons/envelope-open.svg">
  <link rel="stylesheet" href="preview.css?v=valley-preview-b662dcf62cdc">
  <script src="preview.js?v=valley-preview-b662dcf62cdc" defer></script>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="brand"><img src="journey/icons/envelope-open.svg" width="23" height="23" alt="">Cats by Post</p>
        <h1>The postal valley</h1>
        <p class="intro">Explore the papercraft map, then compare each landmark with the room you play.</p>
      </div>
      <a class="play" href="journey/index.html?v=valley-preview-b662dcf62cdc">Open playable map <img src="journey/icons/arrow-right.svg" width="18" height="18" alt=""></a>
    </header>
    <section aria-label="Compare map landmarks with game rooms">
      <div class="controls">
        <label for="landmark">Landmark
          <select id="landmark">
            <option value="office">Sorting Office</option><option value="depot">Town Depot</option>
            <option value="train">Valley Mail</option><option value="cityhall">Civic Mail Hall</option>
            <option value="parcel">Parcel Room</option><option value="christmas">Christmas Night Mail</option>
            <option value="boxroom">Lantern Loft</option>
          </select>
        </label>
        <div class="modes" role="group" aria-label="Comparison view">
          <button type="button" data-view="both" aria-pressed="true">Both</button>
          <button type="button" data-view="map" aria-pressed="false">Map</button>
          <button type="button" data-view="game" aria-pressed="false">Game</button>
        </div>
      </div>
      <div id="pair" class="pair" data-view="both">
        <figure class="map">
          <div class="frame"><img id="terrain" src="journey/images/map-terrain.webp?v=valley-preview-b662dcf62cdc" alt="The Sorting Office beside the river on the valley map"></div>
          <figcaption><span>On the map</span><small id="map-name">Sorting Office</small></figcaption>
        </figure>
        <figure class="game">
          <div class="frame" id="room-frame"><img id="still" src="../cats-by-post-seven-room-archive/after-office.webp" alt="Inside the Sorting Office, with the sorting floor ready for play"></div>
          <figcaption><span id="room-caption">In the game</span><small id="level">Delivery 1-4</small></figcaption>
        </figure>
      </div>
      <div class="live-controls">
        <button type="button" id="watch" aria-pressed="false" hidden>Watch room live</button>
        <a id="play-parcel" class="play" href="journey/play/index.html?review=7-15&amp;v=valley-preview-b662dcf62cdc" hidden>Play Parcel delivery 7-15</a>
        <span id="status" role="status" aria-live="polite"></span>
      </div>
      <noscript><p>Enable JavaScript to change rooms or open the playable map.</p></noscript>
    </section>
    <footer><a href="https://github.com/holleyy/cosysortie/pull/57">Web preview · PR #57</a><a href="../cats-by-post-seven-room-archive/">Seven-room archive</a></footer>
  </main>
</body>
</html>
